<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Welcome | Ashish Barjatya Associates</title>
  <meta name="description" content="Welcome to Ashish Barjatya Associates. Residential plots in Omaxe and Godrej townships across Indore. Chat with us on WhatsApp or call +91 92000 38706." />
  <meta name="theme-color" content="#0B1F5C" />
  <link rel="icon" href="img/aba-logo.jpeg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ashish Barjatya Associates" />
  <meta property="og:title" content="Welcome to Ashish Barjatya Associates" />
  <meta property="og:description" content="Residential plots in Omaxe and Godrej townships across Indore. Authorised channel partner for 20 years." />
  <meta property="og:image" content="img/township.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Mukta:wght@700&family=Sora:wght@600&display=swap" />
  <style>
    :root{--navy:#0B1F5C;--navy-lift:#17358C;--gold:#E0B43C;--wa:#25D366;--wa-lift:#4BE082;--white:#FFFFFF;--soft:rgba(255,255,255,.8);--head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--navy);color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased}
    a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

    /* equal rows above and below keep the brand block in the true centre of the screen */
    .splash{display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;min-height:100vh;min-height:100svh;padding:16px 20px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 50% 45%,var(--navy-lift) 0%,var(--navy) 75%)}
    .brand{grid-row:2}
    .logo{display:block;width:clamp(128px,20vmin,168px);height:auto;aspect-ratio:1;margin-inline:auto;padding:10px;border-radius:50%;object-fit:contain;background:var(--white);box-shadow:0 0 0 3px var(--gold)}
    h1{margin:24px 0 0;font:600 clamp(30px,5.4vw,54px)/1.12 var(--head);letter-spacing:-.03em;text-wrap:balance}
    .hindi{margin:12px 0 0;font:700 clamp(20px,2.6vw,28px)/1.35 'Mukta',var(--body);color:var(--gold)}

    .offer{margin:32px 0 0;font-size:clamp(17px,2vw,20px);font-weight:500;line-height:1.45;color:var(--soft);text-wrap:balance}
    /* navy label, not white: white on WhatsApp green fails contrast */
    .wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;margin-top:16px;padding:0 28px;border-radius:999px;font:600 18px/1 var(--head);color:var(--navy);text-decoration:none;background:var(--wa);box-shadow:0 8px 24px rgba(0,0,0,.3);transition:background-color .15s}
    .wa-btn:hover{background:var(--wa-lift)}
    .wa-btn svg{flex:none;width:24px;height:24px;fill:currentColor}
  </style>
</head>
<body>
  <main class="splash">
    <div class="brand">
      <img class="logo" src="img/aba-logo.jpeg" alt="Ashish Barjatya Associates logo" width="168" height="168" />
      <h1>Ashish Barjatya Associates</h1>
      <p class="hindi" lang="hi">जहाँ सपनों को उनका पता मिलता है</p>
      <p class="offer">Get brochure, price and site visit<br />instantly on WhatsApp</p>
      <a class="wa-btn" href="https://wa.me/919200038706?text=Hello%2C%20I%20would%20like%20to%20know%20about%20plots%20in%20the%20Omaxe%20and%20Godrej%20townships%20in%20Indore.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Chat on WhatsApp
      </a>
    </div>
  </main>
</body>
</html>
